# Proyecto de Xcode generado con XcodeGen: `cd ios && xcodegen`.
# El .xcodeproj no se versiona; esta especificación es la fuente de verdad.
name: Forgia
options:
  bundleIdPrefix: fit.forgia
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.49.0  # 2.50+ pide Swift 6.1 (Xcode 16.3+); subir al actualizar Xcode
targets:
  Forgia:
    type: application
    platform: iOS
    sources:
      - path: Forgia
    configFiles:
      Debug: Config/Forgia.xcconfig
      Release: Config/Forgia.xcconfig
    dependencies:
      - package: Supabase
    info:
      path: Forgia/Info.plist
      properties:
        CFBundleDisplayName: Forgia
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: es_MX
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        ForgiaAPIBaseURL: $(FORGIA_API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fit.forgia.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
